<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify Authentication - Music Player Interface</title>
  <script>
    // Ensure origin consistency: if on localhost, redirect to 127.0.0.1
    if (window.location.hostname === 'localhost') {
      window.location.replace(window.location.href.replace('//localhost:', '//127.0.0.1:'));
    }
  </script>
  <link rel="stylesheet" href="/style.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at center, #181820 0%, #0c0c0e 100%);
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      padding: 20px;
    }

    .callback-card {
      background: rgba(26, 26, 34, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      padding: 40px;
      border-radius: 20px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      animation: scaleUp 0.3s ease-out;
    }

    @keyframes scaleUp {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .callback-icon {
      margin-bottom: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(29, 185, 84, 0.15);
      color: #1db954;
      font-size: 2rem;
    }

    .callback-icon.error {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
    }

    .callback-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 12px 0;
    }

    .callback-message {
      color: #a1a1aa;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 24px;
      text-align: left;
    }

    .callback-spinner {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid #1db954;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .callback-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #1db954;
      color: #000000;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 50px;
      text-decoration: none;
      transition: transform 0.2s, background 0.2s;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .callback-btn:hover {
      background: #1ed760;
      transform: scale(1.04);
    }

    .callback-btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      margin-left: 10px;
    }
    .callback-btn-secondary:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .troubleshoot-box {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      text-align: left;
      font-size: 0.88rem;
    }
    .troubleshoot-box strong {
      color: #1db954;
      display: block;
      margin-bottom: 8px;
    }
    .troubleshoot-box ol {
      padding-left: 20px;
      margin-bottom: 0;
      color: #d1d5db;
    }
    .troubleshoot-box li {
      margin-bottom: 6px;
    }
    .troubleshoot-box code {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      color: #f3f4f6;
    }
  </style>
</head>
<body>
  <div class="callback-card" id="callback-card">
    <div class="callback-spinner" id="callback-spinner"></div>
    <div class="callback-icon" id="callback-icon" style="display: none;">✓</div>
    <h2 class="callback-title" id="callback-title">Connecting to Spotify</h2>
    <div class="callback-message" id="callback-message">
      Verifying PKCE credentials and completing secure token exchange...
    </div>
    <div id="callback-actions" style="display: none;">
      <a href="/" class="callback-btn" id="callback-return-btn">Return to Player</a>
    </div>
  </div>

  <script type="module">
    import { handleAuthCallback } from '/src/spotify-auth.js';

    async function processAuth() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const state = urlParams.get('state');
      const error = urlParams.get('error');

      const title = document.getElementById('callback-title');
      const message = document.getElementById('callback-message');
      const spinner = document.getElementById('callback-spinner');
      const icon = document.getElementById('callback-icon');
      const actions = document.getElementById('callback-actions');

      if (error) {
        spinner.style.display = 'none';
        icon.style.display = 'inline-flex';
        icon.className = 'callback-icon error';
        icon.innerHTML = '✕';
        title.textContent = 'Spotify Authorization Error';
        
        let helpText = '';
        if (error === 'access_denied') {
          helpText = `
            <p>You cancelled the Spotify login request.</p>
            <p>You can return to the player and continue using Last.fm charts and local playlists, or try connecting again.</p>
          `;
        } else {
          helpText = `
            <p>Spotify returned error: <strong>${error}</strong></p>
            <div class="troubleshoot-box">
              <strong>🛠️ Quick Fix in Spotify Developer Dashboard:</strong>
              <ol>
                <li>Open <a href="https://developer.spotify.com/dashboard" target="_blank" style="color: #1db954;">Spotify Developer Dashboard</a>.</li>
                <li>Click your app > <strong>Settings</strong>.</li>
                <li>Under <strong>Redirect URIs</strong>, ensure <code>http://127.0.0.1:5173/callback</code> is added.</li>
                <li>Under <strong>Users and Access</strong>, ensure your Spotify email address is added (required for development mode apps).</li>
                <li>Click <strong>Save</strong> and try logging in again.</li>
              </ol>
            </div>
          `;
        }

        message.innerHTML = helpText;
        actions.style.display = 'block';
        return;
      }

      if (!code) {
        spinner.style.display = 'none';
        icon.style.display = 'inline-flex';
        icon.className = 'callback-icon error';
        icon.innerHTML = '?';
        title.textContent = 'Missing Authorization Code';
        message.innerHTML = `
          <p>No authorization code was found in the URL. Please initiate login from the player interface.</p>
        `;
        actions.style.display = 'block';
        return;
      }

      try {
        await handleAuthCallback(code, state);

        spinner.style.display = 'none';
        icon.style.display = 'inline-flex';
        icon.className = 'callback-icon';
        icon.innerHTML = '✓';
        title.textContent = 'Connected Successfully!';
        message.innerHTML = `
          <p style="text-align: center; color: #1db954; font-weight: 600;">
            Spotify account linked! Redirecting to Music Player...
          </p>
        `;

        if (window.opener && !window.opener.closed) {
          window.opener.postMessage({ type: 'SPOTIFY_AUTH_SUCCESS' }, window.location.origin);
          setTimeout(() => window.close(), 1000);
        } else {
          setTimeout(() => {
            window.location.href = '/';
          }, 1200);
        }
      } catch (err) {
        console.error('Callback token exchange error:', err);
        spinner.style.display = 'none';
        icon.style.display = 'inline-flex';
        icon.className = 'callback-icon error';
        icon.innerHTML = '✕';
        title.textContent = 'Authentication Failed';
        
        message.innerHTML = `
          <p>Error details: <strong>${err.message}</strong></p>
          <div class="troubleshoot-box">
            <strong>💡 Easy Solutions:</strong>
            <ol>
              <li>Ensure your browser is on <code>http://127.0.0.1:5173/</code> (not localhost).</li>
              <li>Verify that <code>http://127.0.0.1:5173/callback</code> is added in the Spotify Developer Dashboard.</li>
              <li>Alternatively, you can paste an Access Token directly in the player's <strong>Connect Spotify</strong> modal.</li>
            </ol>
          </div>
        `;
        actions.style.display = 'block';
      }
    }

    processAuth();
  </script>
</body>
</html>

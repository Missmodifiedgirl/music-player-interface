<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Music Player Interface - Modern Streaming Web App</title>
  <meta name="description" content="A modern music streaming web application powered by Spotify Web API and Last.fm API." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231db954'><polygon points='5 3 19 12 5 21 5 3'/></svg>" />
  <script>
    // Ensure origin consistency: if user opened localhost, normalize to 127.0.0.1
    if (window.location.hostname === 'localhost') {
      window.location.replace(window.location.href.replace('//localhost:', '//127.0.0.1:'));
    }
  </script>
</head>
<body class="dark-theme">
  <div id="root"></div>

  <!-- SCRIPT ENTRY POINT -->

</body>
